<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Knowledge Quest</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-sidebar">
            <div class="auth-sidebar-content">
                <img src="images/logo_white.png" alt="Knowledge Quest" class="logo">
                <h2>Transformez vos révisions avec Knowledge Quest</h2>
                <p>Rejoignez des milliers d'étudiants qui optimisent leur apprentissage dans les domaines de la médecine et du droit.</p>
            </div>
        </div>
        
        <div class="auth-content">
            <div class="auth-header">
                <a href="index.html" class="back-link"><span class="icon">←</span> Retour à l'accueil</a>
            </div>
            
            <div class="auth-form-container">
                <h2>Créez votre compte</h2>
                <form id="register-form" class="auth-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="register-firstname">Prénom</label>
                            <input type="text" id="register-firstname" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="register-lastname">Nom</label>
                            <input type="text" id="register-lastname" name="lastName" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Mot de passe</label>
                        <input type="password" id="register-password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="register-domain">Domaine d'étude</label>
                        <select id="register-domain" name="domain" required>
                            <option value="" disabled selected>Choisissez votre domaine</option>
                            <option value="Médecine">Médecine</option>
                            <option value="Droit">Droit</option>
                        </select>
                    </div>
                    <div class="terms">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a></label>
                    </div>
                    <button type="submit" class="btn-primary btn-block">
                        <span class="spinner"></span>
                        Créer un compte
                    </button>
                </form>
                
                <div class="social-login">
                    <p class="separator"><span>ou s'inscrire avec</span></p>
                    <div class="social-buttons">
                        <button type="button" class="btn-social google">
                            <img src="images/icons/google.svg" alt="Google">
                        </button>
                        <button type="button" class="btn-social microsoft">
                            <img src="images/icons/microsoft.png" alt="Microsoft">
                        </button>
                        <button type="button" class="btn-social apple">
                            <img src="images/icons/apple.svg" alt="Apple">
                        </button>
                    </div>
                </div>
                
                <div class="form-actions">
                    <a href="login.html" class="back-link">Retour à la connexion</a>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="src/index.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
          e.preventDefault();
          window.location.href = 'home.html';
        });
        
        // Pour les boutons d'authentification sociale
        document.querySelectorAll('.btn-social').forEach(button => {
          button.addEventListener('click', function() {
            window.location.href = 'home.html';
          });
        });
      </script>
</body>
</html>

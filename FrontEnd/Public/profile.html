<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil | Knowledge Quest</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/forms.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation latérale -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="images/logo.png" alt="Knowledge Quest" class="logo">
            </div>
            <ul class="nav-links">
                <li class="nav-item"><a href="dashboard.html"><span class="icon">📊</span> Tableau de bord</a></li>
                <li class="nav-item"><a href="create-qcm.html"><span class="icon">✍️</span> Créer un QCM</a></li>
                <li class="nav-item"><a href="upload-document.html"><span class="icon">📄</span> Charger un document</a></li>
                <li class="nav-item"><a href="take-test.html"><span class="icon">🎯</span> Passer un test</a></li>
                <li class="nav-item"><a href="stats.html"><span class="icon">📈</span> Statistiques</a></li>
                <li class="nav-item"><a href="settings.html"><span class="icon">⚙️</span> Paramètres</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="profile.html" class="user-info active">
                    <div class="user-avatar">
                        <div class="initials-avatar">JS</div>
                    </div>
                    <div class="user-details">
                        <p id="user-name">John Smith</p>
                        <span class="domain-badge medicine">Médecine</span>
                    </div>
                </a>
            </div>
        </nav>

        <!-- Contenu principal -->
        <main class="main-content">
            <div class="profile-container">
                <h1 class="page-title">Mon profil</h1>
                
                <div class="profile-header">
                    <div class="profile-avatar-section">
                        <div id="profile-avatar" class="profile-avatar">
                            <div class="initials-avatar">JS</div>
                        </div>
                        <button id="avatar-upload" class="btn-secondary">Modifier la photo</button>
                        <input type="file" id="avatar-input" accept="image/*" hidden>
                    </div>
                    
                    <div class="profile-info">
                        <h2 id="profile-name">John Smith</h2>
                        <p id="profile-email">john.smith@example.com</p>
                        <p id="profile-domain" class="domain-info">Médecine</p>
                        <p id="profile-join-date" class="join-date">Membre depuis le 01/01/2024</p>
                    </div>
                </div>
                
                <div class="profile-messages"></div>
                
                <div class="profile-tabs">
                    <button class="profile-tab-btn active" data-tab="personal">Informations personnelles</button>
                    <button class="profile-tab-btn" data-tab="password">Mot de passe</button>
                </div>
                
                <div id="personal-content" class="profile-tab-content">
                    <form id="personal-info-form" class="profile-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="profile-firstname">Prénom</label>
                                <input type="text" id="profile-firstname" name="firstName" value="John" required>
                            </div>
                            <div class="form-group">
                                <label for="profile-lastname">Nom</label>
                                <input type="text" id="profile-lastname" name="lastName" value="Smith" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="profile-email-input">Email</label>
                            <input type="email" id="profile-email-input" name="email" value="john.smith@example.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="profile-domain-input">Domaine d'étude</label>
                            <select id="profile-domain-input" name="domain" required>
                                <option value="Médecine" selected>Médecine</option>
                                <option value="Droit">Droit</option>
                            </select>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Enregistrer les modifications</button>
                        </div>
                    </form>
                </div>
                
                <div id="password-content" class="profile-tab-content" style="display: none;">
                    <form id="password-form" class="profile-form">
                        <div class="form-group">
                            <label for="current-password">Mot de passe actuel</label>
                            <input type="password" id="current-password" name="currentPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="new-password">Nouveau mot de passe</label>
                            <input type="password" id="new-password" name="newPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirm-password">Confirmer le mot de passe</label>
                            <input type="password" id="confirm-password" name="confirmPassword" required>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Changer le mot de passe</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="src/index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription | Knowledge Quest</title>
  <link rel="stylesheet" href="style/main.css" />
  <link rel="stylesheet" href="style/auth.css" />
  <link rel="stylesheet" href="style/error.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-sidebar">
      <div class="auth-sidebar-content">
        <img src="images/logo_white.png" alt="Knowledge Quest" class="logo" />
        <h2>Transformez vos révisions avec Knowledge Quest</h2>
        <p>Rejoignez des milliers d'étudiants en médecine et en droit qui optimisent leur apprentissage.</p>
      </div>
    </div>

    <div class="auth-content">
      <div class="auth-header">
        <a href="index.html" class="back-link">
          <span class="icon">←</span> Retour à l'accueil
        </a>
      </div>

      <div class="auth-form-container">
        <h2>Inscription</h2>
        <div class="auth-messages"></div>
        
        <form id="register-form" class="auth-form" onsubmit="return false;">
          <div class="form-row">
            <div class="form-group">
              <label for="register-firstname">Prénom</label>
              <input type="text" id="register-firstname" required />
            </div>
            <div class="form-group">
              <label for="register-lastname">Nom</label>
              <input type="text" id="register-lastname" required />
            </div>
          </div>
          
          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" required />
          </div>
          
          <div class="form-group">
            <label for="register-password">Mot de passe</label>
            <input type="password" id="register-password" required />
          </div>
          
          <div class="form-group">
            <label for="register-confirm-password">Confirmer le mot de passe</label>
            <input type="password" id="register-confirm-password" required />
          </div>
          
          <div class="form-group">
            <label for="register-domain">Domaine d'étude</label>
            <select id="register-domain" required>
              <option value="" disabled selected>Choisissez votre domaine</option>
              <option value="Médecine">Médecine</option>
              <option value="Droit">Droit</option>
            </select>
          </div>
          
          <div class="terms">
            <input type="checkbox" id="terms" required />
            <label for="terms">
              J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a>
            </label>
          </div>
          
          <button type="submit" id="register-btn" class="btn-primary btn-block">
            <span class="spinner"></span> Créer un compte
          </button>
        </form>
        
        <div class="social-login">
          <p class="separator"><span>ou s'inscrire avec</span></p>
          <button type="button" id="google-register" class="btn-social google">
            <img src="images/icons/google.svg" alt="Google" /> Continuer avec Google
          </button>
          <button type="button" id="microsoft-register" class="btn-social microsoft">
            <img src="images/icons/microsoft.png" alt="Microsoft" /> Continuer avec Microsoft
          </button>
        </div>
        
        <div class="form-actions mt-4">
          <a href="login.html" class="login-link">Déjà un compte ? Se connecter</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Appel du JS -->
  <script type="module">
    import { showNotification } from './js/components/notification.js';
    import { signInWithGooglePopup } from './js/utils/firebase-auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      // 1️⃣ Échapper la première vérif après logout
      if (location.search.includes("redirect=true")) return;

      // 2️⃣ Si déjà authentifié, rediriger
      if (localStorage.getItem("token")) {
        window.location.href = "dashboard.html";
        return;
      }

      // Inscription standard
      const registerBtn = document.getElementById("register-btn");
      registerBtn.addEventListener("click", async () => {
        const fn = document.getElementById("register-firstname").value.trim();
        const ln = document.getElementById("register-lastname").value.trim();
        const email = document.getElementById("register-email").value.trim();
        const pwd = document.getElementById("register-password").value;
        const conf = document.getElementById("register-confirm-password").value;
        const domain = document.getElementById("register-domain").value;
        const terms = document.getElementById("terms").checked;

        if (!fn || !ln || !email || !pwd || !domain) {
          return showNotification("Tous les champs sont requis", "error");
        }
        if (pwd !== conf) {
          return showNotification("Les mots de passe ne correspondent pas", "error");
        }
        if (!terms) {
          return showNotification("Vous devez accepter les conditions", "error");
        }

        registerBtn.disabled = true;
        registerBtn.querySelector(".spinner")?.classList.add("active");

        try {
          const response = await fetch("http://localhost:5000/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: `${fn} ${ln}`,
              email,
              password: pwd,
              domain
            })
          });
          const data = await response.json();

          if (response.ok && data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));
            localStorage.removeItem("redirectAfterLogin");

            showNotification("Compte créé !", "success");
            setTimeout(() => window.location.href = "dashboard.html", 1200);
          } else {
            showNotification(data.message || "Erreur d'inscription", "error");
          }
        } catch (error) {
          console.error("Erreur:", error);
          showNotification("Erreur serveur", "error");
        } finally {
          registerBtn.disabled = false;
          registerBtn.querySelector(".spinner")?.classList.remove("active");
        }
      });

      // Inscription Google
      const googleBtn = document.getElementById("google-register");
      if (googleBtn) {
        googleBtn.addEventListener('click', async () => {
          try {
            const { token, user } = await signInWithGooglePopup();
            const domain = document.getElementById("register-domain")?.value || "Médecine";

            const res = await fetch("http://localhost:5000/api/auth/google", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, domain })
            });

            const data = await res.json();

            if (res.ok && data.token) {
              localStorage.setItem("token", data.token);
              localStorage.setItem("user", JSON.stringify(data.user));
              window.location.href = "dashboard.html";
            } else {
              showNotification(data.message || "Échec de l'authentification Google", "error");
            }
          } catch (err) {
            console.error("❌ Erreur Google Firebase:", err);
            showNotification("Erreur de connexion avec Google", "error");
          }
        });
      }

      // Inscription Microsoft
      const microsoftBtn = document.getElementById("microsoft-register");
      if (microsoftBtn) {
        microsoftBtn.addEventListener('click', () => {
          const domain = document.getElementById("register-domain")?.value || "Médecine";
          window.location.href = `http://localhost:5000/api/auth/microsoft?state=${encodeURIComponent(domain)}`;
        });
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Knowledge Quest</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/auth.css">
    
    <!-- Scripts pour les authentifications tierces -->
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <script src="https://alcdn.msftauth.net/lib/1.4.4/js/msal.js"></script>
    <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
    
    <!-- Configuration des API sociales -->
    <meta name="google-signin-client_id" content="VOTRE_CLIENT_ID_GOOGLE">
    <meta name="apple-signin-client_id" content="VOTRE_CLIENT_ID_APPLE">
    <meta name="apple-signin-scope" content="name email">
    <meta name="apple-signin-redirect-uri" content="https://votre-domaine.com/callback">
    <meta name="apple-signin-use-popup" content="true">
</head>
<body>
    <div class="auth-container">
        <div class="auth-sidebar">
            <div class="auth-sidebar-content">
                <img src="images/logo_white.png" alt="Knowledge Quest" class="logo">
                <h2>Transformez vos révisions avec Knowledge Quest</h2>
                <p>Rejoignez des milliers d'étudiants qui optimisent leur apprentissage dans les domaines de la médecine et du droit.</p>
            </div>
        </div>
        
        <div class="auth-content">
            <div class="auth-header">
                <a href="index.html" class="back-link"><span class="icon">←</span> Retour à l'accueil</a>
            </div>
            
            <div class="auth-form-container">
                <h2>Créez votre compte</h2>
                
                <div class="auth-messages"></div>

                <form id="register-form" class="auth-form" method="post" onsubmit="return false;">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="register-firstname">Prénom</label>
                            <input type="text" id="register-firstname" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="register-lastname">Nom</label>
                            <input type="text" id="register-lastname" name="lastName" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="register-password">Mot de passe</label>
                        <input type="password" id="register-password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="register-confirm-password">Confirmer le mot de passe</label>
                        <input type="password" id="register-confirm-password" name="confirmPassword" required>
                    </div>

                    <div class="form-group">
                        <label for="register-domain">Domaine d'étude</label>
                        <select id="register-domain" name="domain" required>
                            <option value="" disabled selected>Choisissez votre domaine</option>
                            <option value="Médecine">Médecine</option>
                            <option value="Droit">Droit</option>
                        </select>
                    </div>

                    <div class="terms">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a></label>
                    </div>
                    <button type="button" id="register-btn" class="btn-primary btn-block">
                        <span class="spinner"></span>
                        Créer un compte
                    </button>
                </form>
                
                <div class="social-login">
                    <p class="separator"><span>ou s'inscrire avec</span></p>
                    <div class="social-buttons">
                        <div id="google-signup-btn" class="google-button-container"></div>
                        <button type="button" id="google-register" class="btn-social google">
                            <img src="images/icons/google.svg" alt="Google">
                        </button>
                        <button type="button" id="microsoft-register" class="btn-social microsoft">
                            <img src="images/icons/microsoft.png" alt="Microsoft">
                        </button>
                        <button type="button" id="apple-register" class="btn-social apple">
                            <img src="images/icons/apple.svg" alt="Apple">
                        </button>
                    </div>
                </div>
                
                <div class="form-actions">
                    <a href="login.html" class="back-link">Retour à la connexion</a>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="js/index.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Rediriger si déjà connecté
            if (localStorage.getItem('token')) {
                window.location.href = 'dashboard.html';
                return;
            }
    
            // Gestion du formulaire d'inscription
            const registerBtn = document.getElementById('register-btn');
            const registerForm = document.getElementById('register-form');
            
            if (registerBtn && registerForm) {
                registerBtn.addEventListener('click', async () => {
                    // Récupérer les données du formulaire
                    const firstName = document.getElementById('register-firstname').value.trim();
                    const lastName = document.getElementById('register-lastname').value.trim();
                    const email = document.getElementById('register-email').value.trim();
                    const password = document.getElementById('register-password').value;
                    const confirmPassword = document.getElementById('register-confirm-password').value;
                    const domain = document.getElementById('register-domain').value;
                    const termsCheckbox = document.getElementById('terms');
                    
                    // Validation
                    if (!firstName || !lastName || !email || !password || !domain) {
                        showNotification('Veuillez remplir tous les champs obligatoires', 'error');
                        return;
                    }
                    
                    if (password !== confirmPassword) {
                        showNotification('Les mots de passe ne correspondent pas', 'error');
                        return;
                    }
                    
                    if (!termsCheckbox.checked) {
                        showNotification('Vous devez accepter les conditions d\'utilisation', 'error');
                        return;
                    }
                    
                    // Préparer les données
                    const userData = {
                        name: `${firstName} ${lastName}`,
                        email,
                        password,
                        domain
                    };
                    
                    try {
                        // Activer indicateur de chargement
                        const spinner = registerBtn.querySelector('.spinner');
                        registerBtn.disabled = true;
                        if (spinner) spinner.classList.add('active');
                        
                        // Appel API
                        const response = await fetch('http://localhost:5000/api/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(userData)
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok) {
                            // Succès
                            showNotification('Compte créé avec succès!', 'success');
                            
                            // Si le backend renvoie un token lors de l'inscription
                            if (data.token) {
                                localStorage.setItem('token', data.token);
                                localStorage.setItem('user', JSON.stringify(data.user));
                                
                                // Redirection vers dashboard
                                setTimeout(() => {
                                    window.location.href = 'dashboard.html';
                                }, 1500);
                            } else {
                                // Redirection vers login
                                setTimeout(() => {
                                    window.location.href = 'login.html';
                                }, 1500);
                            }
                        } else {
                            showNotification(data.message || 'Erreur lors de l\'inscription', 'error');
                        }
                    } catch (error) {
                        showNotification('Erreur de connexion au serveur', 'error');
                        console.error('Erreur:', error);
                    } finally {
                        // Désactiver l'indicateur de chargement
                        const spinner = registerBtn.querySelector('.spinner');
                        registerBtn.disabled = false;
                        if (spinner) spinner.classList.remove('active');
                    }
                });
            }
        });
    
        // Fonction pour afficher les notifications
        function showNotification(message, type) {
            const messagesElem = document.querySelector('.auth-messages');
            if (messagesElem) {
                messagesElem.innerHTML = `<div class="notification ${type}">${message}</div>`;
                setTimeout(() => {
                    messagesElem.innerHTML = '';
                }, 5000);
            } else {
                alert(message);
            }
        }
    </script>
</body>
</html>

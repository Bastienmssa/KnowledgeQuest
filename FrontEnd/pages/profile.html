<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil | Knowledge Quest</title>
  <link rel="stylesheet" href="style/main.css" />
  <link rel="stylesheet" href="style/forms.css" />
  <link rel="stylesheet" href="style/error.css" />
</head>
<body>
  <div class="app-container">
    <!-- Navigation latérale -->
    <nav class="sidebar">
      <div class="sidebar-toggle">
        <button id="toggle-sidebar"><span class="toggle-icon">◀</span></button>
      </div>
      <div class="sidebar-header">
        <img src="images/logo_white.png" alt="Knowledge Quest" class="logo" />
      </div>
      <ul class="nav-links">
        <li class="nav-item"><a href="dashboard.html">📊 Tableau de bord</a></li>
        <li class="nav-item"><a href="home.html">🏠 Accueil</a></li>
        <li class="nav-item"><a href="create-qcm.html">✍️ Créer un QCM</a></li>
        <li class="nav-item"><a href="upload-document.html">📄 Charger un document</a></li>
        <li class="nav-item"><a href="take-test.html">🎯 Passer un test</a></li>
        <li class="nav-item"><a href="stats.html">📈 Statistiques</a></li>
        <li class="nav-item"><a href="settings.html">⚙️ Paramètres</a></li>
      </ul>
      <div class="sidebar-footer">
        <a href="profile.html" class="user-info">
          <div class="user-avatar">
            <div class="initials-avatar">JS</div>
          </div>
          <div class="user-details">
            <p id="sidebar-user-name">Utilisateur</p>
            <span id="sidebar-user-domain" class="domain-badge">Domaine</span>
          </div>
        </a>
      </div>
      <div class="sidebar-bottom">
        <button id="logout-button" class="logout-btn">
          <span class="icon">🚪</span>
          <span class="logout-text">Déconnexion</span>
        </button>
      </div>
    </nav>

    <!-- Contenu principal -->
    <main class="main-content">
      <div class="profile-container">
        <h1 class="page-title">Mon profil</h1>

        <div class="profile-header">
          <div class="profile-avatar-section">
            <div id="profile-avatar" class="profile-avatar">
              <div class="initials-avatar">JS</div>
            </div>
            <button id="avatar-upload" class="btn-secondary">Modifier la photo</button>
            <input type="file" id="avatar-input" accept="image/*" hidden />
          </div>

          <div class="profile-info">
            <h2 id="profile-name">Nom Prénom</h2>
            <p id="profile-email">email@example.com</p>
            <div class="profile-details">
              <p id="profile-domain" class="domain-info">
                <span class="icon">🎓</span>
                <span class="domain-text">Domaine</span>
              </p>
              <p id="profile-join-date" class="join-date">
                <span class="icon">📅</span>
                <span class="join-date-text">Membre depuis le ...</span>
              </p>
            </div>
            <div class="profile-stats">
              <div class="stat-item">
                <span class="stat-number" id="stat-tests">-</span>
                <span class="stat-label">Tests complétés</span>
              </div>
              <div class="stat-item">
                <span class="stat-number" id="stat-qcms">-</span>
                <span class="stat-label">QCM créés</span>
              </div>
              <div class="stat-item">
                <span class="stat-number" id="stat-score">-</span>
                <span class="stat-label">Score moyen</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Contenu dynamique des tabs (inchangé) -->
        <div id="profile-tabs-content">
          <!-- Ces contenus sont chargés via profile-page.js -->
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/index.js"></script>
  <script type="module" src="js/components/sidebar.js"></script>
  <script type="module" src="js/utils/error-handler.js"></script>
  <script type="module" src="js/pages/profile-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion | Knowledge Quest</title>
  <link rel="stylesheet" href="style/main.css" />
  <link rel="stylesheet" href="style/auth.css" />
  <link rel="stylesheet" href="style/error.css" />

  <!-- Authentification tierce -->
  <script src="https://apis.google.com/js/platform.js" async defer></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-sidebar">
      <div class="auth-sidebar-content">
        <img src="images/logo_white.png" alt="Knowledge Quest" class="logo" />
        <h2>Transformez vos révisions avec Knowledge Quest</h2>
        <p>Rejoignez des milliers d'étudiants qui optimisent leur apprentissage en médecine et en droit.</p>
      </div>
    </div>

    <div class="auth-content">
      <div class="auth-header">
        <a href="index.html" class="back-link">
          <span class="icon">←</span> Retour à l'accueil
        </a>
      </div>

      <div class="auth-form-container">
        <h2>Connexion</h2>
        <div class="auth-messages"></div>
        
        <form id="login-form" class="auth-form" onsubmit="return false;">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Mot de passe</label>
            <input type="password" id="login-password" required />
          </div>
          
          <button type="submit" id="login-btn" class="btn-primary btn-block">
            <span class="spinner"></span> Se connecter
          </button>
        </form>
        
        <div class="social-login">
          <p class="separator"><span>ou</span></p>
          <button type="button" id="google-login" class="btn-social google">
            <img src="images/icons/google.svg" alt="Google" /> Continuer avec Google
          </button>
        </div>
        
        <div class="form-actions mt-4">
          <a href="register.html" class="create-account-link">Créer un compte</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1️⃣ Si on vient de logout, on ignore ce test initial
      if (location.search.includes("redirect=true")) return;

      // 2️⃣ Si déjà authentifié, aller directement au dashboard
      if (localStorage.getItem("token")) {
        window.location.href = "dashboard.html";
        return;
      }

      const btn = document.getElementById("login-btn");
      btn.addEventListener("click", async () => {
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        
        if (!email || !password) {
          return showNotification("Veuillez remplir tous les champs", "error");
        }

        btn.disabled = true;
        btn.querySelector(".spinner")?.classList.add("active");

        try {
          const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });
          const data = await response.json();

          if (response.ok && data.token) {
            // Stockage du token et de l'utilisateur
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));
            // Suppression de redirectAfterLogin pour éviter le rebouclage
            localStorage.removeItem("redirectAfterLogin");

            showNotification("Connexion réussie !", "success");
            setTimeout(() => window.location.href = "dashboard.html", 1200);
          } else {
            showNotification(data.message || "Échec de la connexion", "error");
          }
        } catch (error) {
          console.error("Erreur:", error);
          showNotification("Erreur de connexion au serveur", "error");
        } finally {
          btn.disabled = false;
          btn.querySelector(".spinner")?.classList.remove("active");
        }
      });

      // Configuration du bouton Google (à implémenter)
      const googleBtn = document.getElementById("google-login");
      if (googleBtn) {
        googleBtn.addEventListener("click", () => {
          // Implémentation future de l'authentification Google
          showNotification("Connexion Google à venir", "info");
        });
      }
    });

    function showNotification(message, type) {
      const container = document.querySelector(".auth-messages");
      if (container) {
        container.innerHTML = `<div class="notification ${type}">${message}</div>`;
        setTimeout(() => (container.innerHTML = ""), 5000);
      } else {
        alert(message);
      }
    }
  </script>
</body>
</html>
